<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#f2f7f5" />
  <title>belong — your social discovery agent</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="device">

    <!-- Splash -->
    <section id="splash" class="screen splash" aria-label="Welcome">
      <button class="splash-hit" id="beginBtn" aria-label="Tap to begin">
        <h1 class="logo logo-xl">belong</h1>
        <p class="tagline">your social discovery agent</p>
        <p class="motto">A brief chat. A lasting belonging.</p>
        <span class="tap">TAP TO BEGIN</span>
      </button>
    </section>

    <!-- Chat -->
    <section id="chat" class="screen chat" aria-label="Chat" hidden>
      <header class="topbar">
        <button class="icon-btn" id="menuBtn" aria-label="Open history">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <span class="logo logo-sm">belong</span>
        <span class="spacer"></span>
        <button class="icon-btn voice-btn" id="voiceBtn" aria-label="Mute belong's voice" aria-pressed="true">
          <svg class="on-ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          <svg class="off-ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" aria-label="Settings" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>

        <div class="dropdown" id="settingsMenu" role="menu" hidden>
          <div class="dd-head">
            <div class="dd-email">user@example.com</div>
            <div class="dd-plan">Belong Standard</div>
          </div>
          <button class="dd-item" role="menuitem">App Settings</button>
          <button class="dd-item" role="menuitem">Upgrade to Belong Plus</button>
          <button class="dd-item dd-danger" role="menuitem" id="logoutBtn">Log Out</button>
        </div>
      </header>

      <main class="messages" id="messages" aria-live="polite"></main>

      <!-- Input dock: voice first, typing as a fallback -->
      <div class="dock voice" id="dock">
        <div class="dock-main">
          <div class="voice-pane" id="voicePane">
            <p class="caption" id="caption" aria-live="polite"></p>
            <button type="button" class="big-mic" id="bigMic" aria-label="Speak to belong">
              <span class="ring r1"></span><span class="ring r2"></span>
              <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            </button>
            <p class="voice-status" id="voiceStatus">belong is speaking…</p>
          </div>
          <form class="composer" id="composer" autocomplete="off">
            <input id="input" type="text" aria-label="Message" placeholder="Type a message, or pick an answer" />
            <button type="button" class="mic" id="micBtn" aria-label="Voice input">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            </button>
          </form>
        </div>
        <button type="button" class="switch" id="switchBtn" aria-label="Switch to typing">
          <svg class="kb" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M7 14h10"/></svg>
          <svg class="wave" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>
        </button>
      </div>

      <!-- History drawer -->
      <div class="scrim" id="scrim" hidden></div>
      <aside class="drawer" id="drawer" aria-label="History" aria-hidden="true">
        <div class="drawer-head">
          <h2>History</h2>
          <button class="icon-btn" id="closeDrawer" aria-label="Close history">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
        <ul class="history" id="history"></ul>
      </aside>

      <!-- Meeting detail -->
      <section class="detail" id="detail" aria-label="Meeting details" aria-hidden="true">
        <header class="detail-top">
          <button class="icon-btn" id="detailBack" aria-label="Back to history">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="detail-label">History</span>
        </header>
        <div class="detail-body" id="detailBody"></div>
      </section>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
